name: Firmware checks
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
      - name: Install devenv 2.4.0
        run: nix profile add github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
      - name: Check and build both layouts
        run: devenv shell -- bash scripts/check.sh
      - name: Package OTA-capable trial firmware
        run: devenv shell -- env KONGLE_FEATURES=mcuboot,ota-activation bash scripts/build-dfu-package.sh
      - name: Upload development firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kongle-mcuboot-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/mcuboot/thumbv7em-none-eabihf/release/kongle
            target/mcuboot/thumbv7em-none-eabihf/release/mcuboot/pinetime-mcuboot-app-image.bin
            target/mcuboot/thumbv7em-none-eabihf/release/mcuboot/kongle-mcuboot-app-dfu-*.zip
