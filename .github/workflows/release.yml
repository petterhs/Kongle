name: Firmware release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fetch master for release policy
        run: git fetch origin master
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
      - name: Install devenv 2.4.0
        run: nix profile add github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
      - name: Run firmware checks
        run: devenv shell -- bash scripts/check.sh
      - name: Build and verify OTA-capable trial firmware
        run: devenv shell -- env KONGLE_FEATURES=mcuboot,ota-activation bash scripts/build-dfu-package.sh
      - name: Verify image and prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          devenv shell -- imgtool verify target/mcuboot/thumbv7em-none-eabihf/release/mcuboot/pinetime-mcuboot-app-image.bin
          python3 scripts/prepare-release.py "$RELEASE_TAG"
          devenv shell -- bash scripts/release-notes.sh "$RELEASE_TAG" dist/CHANGELOG.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            *-rc.*|*-dev.*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "$RELEASE_TAG" dist/kongle-"$RELEASE_TAG"-dfu.zip dist/SHA256SUMS dist/CHANGELOG.md --verify-tag --title "Kongle $RELEASE_TAG" --notes-file dist/CHANGELOG.md $prerelease
