[package]
name = "kongle"
version = "0.2.0"
authors = ["Petter HS"]
edition = "2021"
license = "MIT"
readme = "README.md"
repository = ""

[dependencies]
# Embassy framework
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-nrf = { version = "0.9.0", features = ["defmt", "nrf52832", "time-driver-rtc1", "rt", "gpiote", "unstable-pac", "time", "nfc-pins-as-gpio"] }
embassy-time = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.7.2" }
embassy-futures = { version = "0.1.2" }
embassy-embedded-hal = { version = "0.5.0", default-features = false }

# BLE stack - using nrf-softdevice for now (simpler setup)
# nrf-softdevice = { version = "0.1.0", features = ["defmt", "nrf52832", "s132"] }

# Placeholder for future trouble-host migration
# nrf-sdc = { version = "0.1.0", default-features = false, features = ["defmt", "nrf52832", "peripheral"] }
# nrf-mpsl = { version = "0.1.0", default-features = false, features = ["defmt", "critical-section-impl"] }
# bt-hci = { version = "0.1.2", default-features = false, features = ["defmt"] }
# trouble-host = { version = "0.1.0", features = ["defmt", "gatt", "peripheral", "l2cap-tx-packet-pool-size-16"] }

# Display and graphics
display-interface-spi = "0.5"
embedded-graphics = "0.8"
st7789 = { version = "0.7.0", features = ["graphics", "batch"], default-features = false }
mipidsi = { version = "0.8", default-features = false, features = ["heapless"] }

# Hardware abstraction
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-hal-bus = "0.2"
embedded-io = "0.6"
embedded-io-async = "0.6"
embedded-storage = "0.3"
embedded-storage-async = "0.4"

# Utilities
heapless = { version = "0.8", features = ["defmt-03"] }
chrono = { version = "0.4.43", default-features = false }
futures = { version = "0.3", default-features = false, features = ["async-await"] }
static_cell = "1.3"
byte-slice-cast = { version = "1.2.3", default-features = false }
debouncr = "0.2.2"

# Debugging and panic
defmt = "1.0.1"
defmt-rtt = "0.4.2"
panic-probe = { version = "0.3.2", features = ["print-defmt"] }
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"

# Time
time = { version = "0.3.46", default-features = false }

[features]
default = []
baremetal = []

[patch.crates-io]
# Use stable versions for now to avoid build issues
# TODO: Switch back to latest versions once deps are stable

[profile.release]
debug = 2
codegen-units = 1
incremental = false
lto = "fat"
opt-level = 's' # try `s` or `z`, sometimes one is smaller, sometimes the other.
