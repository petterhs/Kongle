[package]
name = "kongle"
version = "0.2.0"
authors = ["Petter HS"]
edition = "2021"
license = "MIT"
readme = "README.md"
repository = ""

[dependencies]
# Embassy framework
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-nrf = { version = "0.9.0", features = ["defmt", "nrf52832", "time-driver-rtc1", "rt", "gpiote", "unstable-pac", "time", "nfc-pins-as-gpio"] }
embassy-time-queue-utils = "0.3"
embassy-time = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.7.2" }
embassy-futures = { version = "0.1.2" }
embassy-embedded-hal = { version = "0.5.0", default-features = false }

# BLE stack - trouble-host + Apache NimBLE (no nRF SoftDevice)
apache-nimble = { version = "0.1.0", features = ["port-layer-embassy", "nrf52832", "controller"] }
trouble-host = { version = "0.5", default-features = false, features = ["defmt", "derive", "gatt", "peripheral", "default-packet-pool"] }
trouble-host-macros = "0.3"
bt-hci = "0.6"

# Display and graphics
display-interface-spi = "0.5"
embedded-graphics = "0.8"
st7789 = { version = "0.7.0", features = ["graphics", "batch"], default-features = false }
mipidsi = { version = "0.8", default-features = false, features = ["heapless"] }

# Hardware abstraction
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-hal-bus = "0.2"
embedded-io = "0.6"
embedded-io-async = "0.6"
embedded-storage = "0.3"
embedded-storage-async = "0.4"

# Utilities
heapless = { version = "0.8", features = ["defmt-03"] }
heapless09 = { package = "heapless", version = "0.9" } # trouble-host's GATT value type
chrono = { version = "0.4.43", default-features = false }
futures = { version = "0.3", default-features = false, features = ["async-await"] }
static_cell = "1.3"
byte-slice-cast = { version = "1.2.3", default-features = false }
debouncr = "0.2.2"

# Debugging and panic
defmt = "1.0.1"
defmt-rtt = "0.4.2"
panic-probe = { version = "0.3.2", features = ["print-defmt"] }
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"

# Time
time = { version = "0.3.46", default-features = false }

[features]
default = []
baremetal = []
# Link for MCUBoot primary slot (0x08200). Use for scripts/flash_app.sh; omit for cargo run --release.
mcuboot = []
# Opt-in development-board receiver. Default builds never erase external flash.
ota-staging = ["mcuboot"]
# Compiles the pending-image trailer writer. No production call site or SPI
# implementation exists yet; enabling this alone cannot activate an image.
ota-activation = ["ota-staging"]

[workspace]
members = ["tests/host"]
resolver = "2"

[patch.crates-io]
# Return copied HCI event buffers and buffer incoming ACL bursts during DFU.
# See petterhs/apache-nimble-sys#1.
apache-nimble = { git = "https://github.com/petterhs/apache-nimble-sys.git", rev = "9c872c2f215ea34ade985802bfce098583e958f1" }

[profile.release]
debug = 2
codegen-units = 1
incremental = false
lto = "fat"
opt-level = 's' # try `s` or `z`, sometimes one is smaller, sometimes the other.
